# =====================================================
# 🎯 BMSChat — КОНФИГУРАЦИЯ FLUTTER-ПРОЕКТА
# =====================================================

name: bmschat
description: "BMSChat — мессенджер для команды «Отряд Боба Марли»"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

# =====================================================
# 📦 ЗАВИСИМОСТИ
# =====================================================
dependencies:
  flutter:
    sdk: flutter

  # ═══════════════════════════════════════════════════
  # 🌐 СЕТЬ (API + WebSocket)
  # ═══════════════════════════════════════════════════
  http: ^1.1.0
  socket_io_client: ^2.0.3+1

  # ═══════════════════════════════════════════════════
  # 💾 ХРАНЕНИЕ
  # ═══════════════════════════════════════════════════
  shared_preferences: ^2.2.2

  # ═══════════════════════════════════════════════════
  # ⚡ УПРАВЛЕНИЕ СОСТОЯНИЕМ
  # ═══════════════════════════════════════════════════
  provider: ^6.1.1

  # ═══════════════════════════════════════════════════
  # 🎨 UI (интерфейс)
  # ═══════════════════════════════════════════════════
  cupertino_icons: ^1.0.6
  intl: ^0.18.1
  flutter_animate: ^4.5.0
  image_picker: 1.0.4

  # 🎯 ШАГ 10: пикер эмодзи для аватарок каналов
  emoji_picker_flutter: ^2.2.0

  # 🎯 ЭТАП D.1: кэш сетевых картинок (аватары, вложения)
  # Аватары и картинки кэшируются на диск — не грузятся повторно
  cached_network_image: ^3.3.1

# =====================================================
# 🧪 DEV-ЗАВИСИМОСТИ
# =====================================================
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

# =====================================================
# 🎨 НАСТРОЙКИ FLUTTER
# =====================================================
flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icon/


# =====================================================
# 🎨 ИКОНКА ПРИЛОЖЕНИЯ
# =====================================================
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true    