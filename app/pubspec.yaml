# =====================================================
# 🎯 BMSChat — КОНФИГУРАЦИЯ FLUTTER-ПРОЕКТА
# =====================================================

name: bmschat
description: "BMSChat — мессенджер для команды «Отряд Боба Марли»"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

# =====================================================
# 📦 ЗАВИСИМОСТИ
# =====================================================
dependencies:
  flutter:
    sdk: flutter

  # ═══════════════════════════════════════════════════
  # 🌐 СЕТЬ (API + WebSocket)
  # ═══════════════════════════════════════════════════
  http: ^1.1.0
  socket_io_client: ^2.0.3+1

  # ═══════════════════════════════════════════════════
  # 💾 ХРАНЕНИЕ
  # ═══════════════════════════════════════════════════
  shared_preferences: ^2.2.2

  # ═══════════════════════════════════════════════════
  # ⚡ УПРАВЛЕНИЕ СОСТОЯНИЕМ
  # ═══════════════════════════════════════════════════
  provider: ^6.1.1

  # ═══════════════════════════════════════════════════
  # 🎨 UI (интерфейс)
  # ═══════════════════════════════════════════════════
  cupertino_icons: ^1.0.6
  intl: ^0.18.1
  flutter_animate: ^4.5.0
  image_picker: 1.0.4

  # 🎯 ШАГ 10: пикер эмодзи для аватарок каналов
  emoji_picker_flutter: ^2.2.0

# =====================================================
# 🧪 DEV-ЗАВИСИМОСТИ
# =====================================================
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# =====================================================
# 🎨 НАСТРОЙКИ FLUTTER
# =====================================================
flutter:
  uses-material-design: true
  
  assets:
    - assets/images/