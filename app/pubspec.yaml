# =====================================================
# 🎯 BMSChat — КОНФИГУРАЦИЯ FLUTTER-ПРОЕКТА
# =====================================================
# Этот файл описывает:
#   • Имя проекта
#   • Зависимости (пакеты)
#   • Ресурсы (assets)
#   • Настройки сборки
#
# После изменений выполните: flutter pub get
# =====================================================

name: bmschat
description: "BMSChat — мессенджер для команды «Отряд Боба Марли»"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

# =====================================================
# 📦 ЗАВИСИМОСТИ
# =====================================================
dependencies:
  flutter:
    sdk: flutter

  # ═══════════════════════════════════════════════════
  # 🌐 СЕТЬ (API + WebSocket)
  # ═══════════════════════════════════════════════════
  
  # HTTP-запросы к REST API
  # Используется в: api_service.dart
  http: ^1.1.0

  # WebSocket для реального времени
  # «Печатает...», онлайн-статусы, мгновенные сообщения
  # Используется в: socket_service.dart
  socket_io_client: ^2.0.3+1

  # ═══════════════════════════════════════════════════
  # 💾 ХРАНЕНИЕ
  # ═══════════════════════════════════════════════════
  
  # Хранение JWT-токена и данных пользователя
  # Работает на Android (SharedPreferences) и iOS (NSUserDefaults)
  # Используется в: storage_service.dart
  shared_preferences: ^2.2.2

  # ═══════════════════════════════════════════════════
  # ⚡ УПРАВЛЕНИЕ СОСТОЯНИЕМ
  # ═══════════════════════════════════════════════════
  
  # Провайдеры для состояния приложения
  # Используется в: auth_provider.dart, chat_provider.dart
  provider: ^6.1.1

  # ═══════════════════════════════════════════════════
  # 🎨 UI (интерфейс)
  # ═══════════════════════════════════════════════════
  
  # iOS-иконки (для iPhone-стиля)
  cupertino_icons: ^1.0.6

  # Форматирование дат на русском
  # «14:30», «вчера», «3 дня назад»
  intl: ^0.18.1

  # Плавные анимации
  # Используется в: splash_screen.dart, message_bubble.dart
  flutter_animate: ^4.5.0
  image_picker: 1.0.4

# =====================================================
# 🧪 DEV-ЗАВИСИМОСТИ (только для разработки)
# =====================================================
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# =====================================================
# 🎨 НАСТРОЙКИ FLUTTER
# =====================================================
flutter:
  uses-material-design: true
  
  # ═══════════════════════════════════════════════════
  # 📁 РЕСУРСЫ (assets)
  # ═══════════════════════════════════════════════════
  # Папки с картинками, шрифтами и т.д.
  # Создадим их позже (если понадобятся)
  assets:
    - assets/images/